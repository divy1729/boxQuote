services:
  - type: web
    name: boxquote
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boxquote-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: boxquote-db
    databaseName: boxquote
    user: boxquote
    plan: free
