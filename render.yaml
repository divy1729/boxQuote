services:
  - type: web
    name: boxquote
    env: node
    region: oregon
    buildCommand: npm install && cd server && npm install && npm run build && cd ../client && npm install && npm run build
    startCommand: npm run start --workspace server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boxquote-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: boxquote-db
    databaseName: boxquote
    user: boxquote
    plan: free